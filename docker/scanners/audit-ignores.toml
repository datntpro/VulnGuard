# Evidenced, expiring ignores for `pip-audit` over docker/scanners/*.txt (#101 PR-C).
# Enforced by scripts/audit_scanner_locks.py (CI `test` job). Rules:
#   * every entry needs id, lock, package, version, reason, evidence, added, expires, tracking
#   * expires - added <= 120 days; an expired entry FAILS the gate (re-verify or bump the lock)
#   * an ignore only applies while the lock still pins package==version (a bump re-opens it)
#   * reachability argument is re-checked on every CI run by scripts/scanner_reachability/check.py
# Re-verify on every semgrep/checkov bump (see .github/dependabot.yml). Do NOT add multi-`*`
# `paths:` globs to scanner/rules/*.yaml (wcmatch ReDoS argument below depends on it).

