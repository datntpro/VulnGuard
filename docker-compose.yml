services:
  # ─────────────────────────────────────────────
  # VulnGuard — API + Scanner Engine
  # Ollama chạy sẵn trên máy local, KHÔNG cần Docker
  # ─────────────────────────────────────────────
  vulnguard:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: vulnguard-api
    # H4: chỉ phơi ra localhost theo mặc định. Truy cập từ máy khác trong LAN: VULNGUARD_BIND=0.0.0.0
    # (xem wiki "Truy cập từ máy khác trong LAN"). Cổng proxy MITM có biến bind RIÊNG (mặc định loopback)
    # nên mở UI ra LAN không làm lộ proxy.
    ports:
      - "${VULNGUARD_BIND:-127.0.0.1}:${VULNGUARD_PORT:-8080}:8080"
      # Recording MITM proxy (Pentest Agent — bắt bằng chứng từ trình duyệt/công cụ)
      - "${PENTEST_PROXY_BIND:-127.0.0.1}:${PENTEST_PROXY_PORT:-8788}:8788"
    # H4: chặn leo thang đặc quyền trong container.
    security_opt:
      - no-new-privileges:true
    volumes:
      # Container chạy non-root (uid 10001). Nếu ./storage không ghi được (vd nâng cấp từ bản cũ
      # chạy root), chạy:  sudo chown -R 10001:10001 storage   (KHÔNG dùng chmod 777).
      - ./storage:/app/storage
      # KHÔNG mount docker.sock mặc định (N-5): ":ro" trên unix socket KHÔNG chặn gọi API
      # (POST /containers/create với Privileged vẫn được chấp nhận → root trên host).
      # Muốn quét image CHỈ có ở máy local: dùng override có socket-proxy chỉ-đọc:
      #   docker compose -f docker-compose.yml -f docker-compose.local-images.yml up -d
      # (image công khai vẫn quét được vì Trivy tự pull từ registry).
      - ${SCAN_WORKSPACE:-/tmp}:/workspace
    environment:
      - DEPLOY_MODE=docker
      - DATABASE_URL=sqlite:////app/storage/db/vulnguard.db
      # host.docker.internal → trỏ vào máy thật (Ollama đang chạy ở đó)
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      # Coworker Host Service — chạy native trên host (bash coworker_host/run.sh),
      # cho tính năng Co-work đọc/sửa file & chạy lệnh ngoài Docker
      - COWORKER_URL=${COWORKER_URL:-http://host.docker.internal:8765}
      - COWORKER_TIMEOUT=${COWORKER_TIMEOUT:-30}
      # Token xác thực coworker_host (BẮT BUỘC). Đặt GIỐNG NHAU ở đây và khi chạy
      # coworker_host/run.sh trên máy host. Để trống → Co-work gọi host sẽ bị 401.
      - VULNGUARD_COWORKER_TOKEN=${VULNGUARD_COWORKER_TOKEN:-}
      - MAX_SCANS_PER_PROJECT=${MAX_SCANS_PER_PROJECT:-5}
      - APP_ENV=${APP_ENV:-production}
      # Chỉ tin X-Forwarded-For từ các IP này (uvicorn). Đặt IP reverse proxy trong .env nếu có.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Cấu hình app đi qua compose (container KHÔNG đọc .env trực tiếp)
      - VULNGUARD_BIND=${VULNGUARD_BIND:-127.0.0.1}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      - VULNGUARD_SECRET_KEY=${VULNGUARD_SECRET_KEY:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - EXPOSE_API_DOCS=${EXPOSE_API_DOCS:-true}
      - SCM_ALLOW_HTTP=${SCM_ALLOW_HTTP:-false}
      - SCM_ALLOW_PRIVATE_HOSTS=${SCM_ALLOW_PRIVATE_HOSTS:-true}
      # SonarQube (tuỳ chọn) — trỏ server sẵn có, hoặc dùng service bundled bên dưới
      - SONARQUBE_URL=${SONARQUBE_URL:-}
      - SONARQUBE_TOKEN=${SONARQUBE_TOKEN:-}
    # Cần extra_hosts để container resolve host.docker.internal trên Linux
    # macOS/Windows Docker Desktop tự xử lý, không cần dòng này
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # SonarQube Community (TUỲ CHỌN) — bật bằng:  docker compose --profile sonar up -d
  # Mặc định KHÔNG chạy (nặng RAM). Sau khi lên, tạo token rồi đặt vào .env:
  #   SONARQUBE_URL=http://sonarqube:9000   SONARQUBE_TOKEN=<token>
  # Lưu ý host Linux cần: sysctl -w vm.max_map_count=524288
  # ─────────────────────────────────────────────
  sonarqube:
    image: sonarqube:community
    container_name: vulnguard-sonarqube
    profiles: ["sonar"]
    depends_on:
      - sonarqube-db
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONARQUBE_DB_PASSWORD:-sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonarqube-db:
    image: postgres:16-alpine
    container_name: vulnguard-sonarqube-db
    profiles: ["sonar"]
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONARQUBE_DB_PASSWORD:-sonar}
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:

networks:
  default:
    name: vulnguard-network
