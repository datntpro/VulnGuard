# B-6/L-5: cập nhật dependency có kiểm soát (PR hàng tuần) thay vì ">=" tự trôi phiên bản.
# Lưu ý: api/requirements.txt là lockfile sinh từ requirements.in (uv pip compile) — khi merge PR
# dependabot cho .txt, chạy lại lệnh compile ở đầu file để giữ nhất quán với .in.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/api"
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: "/docker/scanners"
    schedule: { interval: weekly }
    ignore:
      # semgrep.in ghim setuptools<81: opentelemetry-instrumentation (dep của semgrep) còn import
      # pkg_resources, bị gỡ từ setuptools 81. Bỏ ignore này khi semgrep không còn cần pkg_resources.
      - dependency-name: "setuptools"
        versions: [">=81"]
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: "/coworker_host"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/api"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      docker-actions:
        patterns: ["docker/*"]
