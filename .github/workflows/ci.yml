# CI — cổng chất lượng/bảo mật cho pipeline (khép vòng DevSecOps).
# Chạy test tự động + gate Bandit (chặn merge nếu có lỗ hổng HIGH chưa triage).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests + Bandit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # #101 PR-A: semgrep từ lock (venv cô lập, Python 3.11 như image) để test rule bundled CHẠY thật.
      # Đặt TRƯỚC setup-python 3.12 (cái cuối thắng cho `python`/`pip`).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: py311
        with:
          python-version: "3.11"
      - name: Install semgrep from the scanner lock (isolated venv, same as the image)
        run: |
          "${{ steps.py311.outputs.python-path }}" -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install -q --require-hashes -r docker/scanners/semgrep.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          # B-6: cài từ lockfile có hash (pin đúng phiên bản, kiểm hash từng gói)
          pip install -q --require-hashes -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Audit dependencies (pip-audit trên lockfile)
        run: |
          python -m venv "$RUNNER_TEMP/pipaudit"
          "$RUNNER_TEMP/pipaudit/bin/pip" install -q --require-hashes -r docker/scanners/pip-audit.txt
          "$RUNNER_TEMP/pipaudit/bin/pip-audit" -r api/requirements.txt --require-hashes --disable-pip
      - name: PDF engine self-test (native, same check as Docker build / setup.py --check)
        run: python -m scanner.pdf.selftest
      - name: Run tests
        env:
          AUTH_ENABLED: "true"
          VG_REQUIRE_SEMGREP: "1"
        run: pytest tests/ -q
      - name: Bandit gate (fail on HIGH severity, HIGH confidence)
        run: bandit -r api scanner mcp_server scripts -lll -ii -q

  # PR-4: API image must build AND pass the PDF (Typst) self-test on both architectures. The self-test is a
  # RUN step in api/Dockerfile, so a broken wheel/font/sandbox fails the build. arm64 runs on a native
  # arm runner (no QEMU). Verifies the hashed lockfile resolves a typst wheel for linux/aarch64 + x86_64.
  pdf-docker:
    name: pdf-docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build API image (runs python -m scanner.pdf.selftest)
        run: docker build --build-arg TARGETARCH=${{ matrix.arch }} -f api/Dockerfile -t vulnguard-api:pdfcheck .
      - name: Re-run PDF self-test in the image (non-root, read-only rootfs, no network)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python \
            vulnguard-api:pdfcheck -m scanner.pdf.selftest
      - name: Gitleaks scanner finds a planted secret with the pinned binary (argv contract)
        run: |
          docker run --rm --network none --entrypoint python vulnguard-api:pdfcheck -c '
          import asyncio, os, tempfile
          from scanner.scanners.secrets import GitleaksScanner
          d = tempfile.mkdtemp()
          open(os.path.join(d, "creds.py"), "w").write("T = \"ghp_" + "x7K9mQ2wLp4RtZ8vB3nYc6HdJ1sFa5GuE0oW" + "\"\n")
          out = asyncio.run(GitleaksScanner(d).scan())
          assert out, "gitleaks found nothing: pinned binary rejected the argv or rules changed"
          print("gitleaks findings:", len(out))
          '
      - name: Scanner smoke in the image (non-root, read-only rootfs, no network)
        # Chạy từng scanner đóng gói sẵn trên fixture có lỗi đã biết; tool hỏng im lặng → đỏ.
        # (#120 đã merge: gitleaks/trivy-iac phải đạt, không còn xfail.)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /home/appuser:uid=10001,gid=10001,mode=0700 \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 -e SEMGREP_SEND_METRICS=off \
            -v "$PWD/tests/fixtures:/fx:ro" --entrypoint python \
            vulnguard-api:pdfcheck -m scanner.scanners.selftest /fx
