# Security self-scan (dogfood) — VulnGuard tự quét chính mình bằng đúng bộ công cụ tích hợp.
# Báo cáo dạng artifact (KHÔNG chặn merge). Teams siết thành gate bằng cách bỏ "|| true".
# Dùng cài CLI trực tiếp (không phụ thuộc third-party action dễ vỡ version).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # mỗi thứ Hai 02:00 UTC

permissions:
  contents: read

jobs:
  self-scan:
    name: SAST / SCA / Secrets self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install -q bandit semgrep pip-audit || true

      - name: Bandit (SAST, full report)
        run: bandit -r api scanner mcp_server scripts -f txt -o bandit-report.txt || true

      - name: Semgrep (OWASP + security-audit + secrets)
        run: semgrep scan --config p/python --config p/security-audit --config p/secrets --sarif --output semgrep.sarif || true

      - name: pip-audit (dependencies)
        run: pip-audit -r api/requirements.txt -f columns -o pip-audit.txt || true

      - name: Install gitleaks + trivy
        run: |
          # gitleaks
          GL=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" -o /tmp/gl.tgz || true
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks 2>/dev/null || true
          sudo mv /tmp/gitleaks /usr/local/bin/ 2>/dev/null || true
          # trivy (script chính thức)
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin || true

      - name: Gitleaks (secrets)
        run: gitleaks detect --source . --no-banner --redact -c .gitleaks.toml --report-format json --report-path gitleaks.json || true

      - name: Trivy filesystem (vuln + misconfig + secret)
        run: trivy fs --quiet --scanners vuln,misconfig,secret --severity HIGH,CRITICAL . > trivy.txt 2>&1 || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            semgrep.sarif
            pip-audit.txt
            gitleaks.json
            trivy.txt
          if-no-files-found: ignore
