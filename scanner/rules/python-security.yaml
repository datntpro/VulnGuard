# Bundled semgrep rules (chạy offline). Mỗi rule PHẢI có fixture
# tests/fixtures/semgrep_rules/<id>.py (chú thích `# ruleid:` / `# ok:`) — xem
# tests/test_semgrep_bundled_rules.py.
# Lưu ý: các mục dưới `patterns:` là AND; các phương án thay thế phải đặt trong
# `pattern-either:`. `metavariable-regex` neo ở đầu chuỗi (dùng `.*` nếu cần).
# Không thêm glob `paths:` nhiều dấu `*` (wcmatch ReDoS — xem #101).
rules:
  # ── SQL Injection ──────────────────────────────────────────────────────────
  - id: sql-injection-string-concat
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute($A + $B, ...)
          - pattern: $CURSOR.executemany($A + $B, ...)
          - pattern: $CURSOR.executescript($A + $B, ...)
      - pattern-not: $CURSOR.$M("..." + "...", ...)
    message: "SQL injection via string concatenation. Use parameterized queries."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"

  - id: sql-injection-format
    patterns:
      - pattern-either:
          - pattern: $CURSOR.$EXEC(f"...", ...)
          - pattern: $CURSOR.$EXEC("..." % $INPUT, ...)
          - pattern: $CURSOR.$EXEC("...".format(...), ...)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(execute|executemany|executescript)$
      - pattern-not: $CURSOR.$EXEC(f"{...}", ...)
    message: "SQL injection via f-string, % or .format(). Use parameterized queries."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89"

  # ── Command Injection ──────────────────────────────────────────────────────
  - id: subprocess-shell-true
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(run|call|Popen|check_output|check_call|getoutput|getstatusoutput)$
    message: "subprocess with shell=True can lead to command injection."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"

  - id: os-system-injection
    patterns:
      - pattern: os.system($CMD)
      - pattern-not: os.system("...")
    message: "os.system() is vulnerable to command injection. Use subprocess with a list."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78"

  # ── Insecure Deserialization ───────────────────────────────────────────────
  - id: pickle-loads
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: _pickle.loads(...)
      - pattern: _pickle.load(...)
      - pattern: pickle.Unpickler(...)
    message: "Deserialization with pickle is dangerous with untrusted data."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"

  - id: yaml-unsafe-load
    pattern-either:
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.unsafe_load_all(...)
      - patterns:
          - pattern-either:
              - pattern: yaml.load(...)
              - pattern: yaml.load_all(...)
          - pattern-not: yaml.$F(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.$F(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.$F(..., Loader=SafeLoader, ...)
          - pattern-not: yaml.$F(..., Loader=CSafeLoader, ...)
          - pattern-not: yaml.$F($D, yaml.SafeLoader)
          - pattern-not: yaml.$F($D, yaml.CSafeLoader)
    message: "yaml.load() without SafeLoader can execute arbitrary code. Use yaml.safe_load()."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502"

  # ── Cryptography ───────────────────────────────────────────────────────────
  - id: weak-hash-md5
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("MD5", ...)
      - pattern-not: hashlib.$F(..., usedforsecurity=False, ...)
    message: "MD5 is cryptographically broken. Use SHA-256 or stronger."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-327"

  - id: weak-hash-sha1
    patterns:
      - pattern-either:
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("sha1", ...)
          - pattern: hashlib.new("SHA1", ...)
      - pattern-not: hashlib.$F(..., usedforsecurity=False, ...)
    message: "SHA-1 is deprecated for security use. Use SHA-256 or stronger."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-327"

  # ── Hardcoded Secrets ──────────────────────────────────────────────────────
  - id: hardcoded-password-variable
    patterns:
      - pattern: $VAR = "$PASS"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|pwd|secret|api_?key|token|credential)
      - metavariable-regex:
          metavariable: $PASS
          regex: ^(?![A-Z][A-Z0-9_]*$)(?!https?://)\S{8,}$
    message: "Possible hardcoded credential in variable. Use environment variables."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"

  # ── Path Traversal ─────────────────────────────────────────────────────────
  - id: open-with-user-input
    patterns:
      - pattern-either:
          - pattern: open($A + $B, ...)
          - pattern: open(f"...", ...)
      - pattern-not: open("..." + "...", ...)
      - pattern-not: open(f"{...}", ...)
    message: "Opening files with user-controlled paths can lead to path traversal."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-22"

  # ── Debug/Dev Settings ─────────────────────────────────────────────────────
  - id: flask-debug-true
    pattern: $APP.run(..., debug=True, ...)
    message: "Flask debug mode enabled. Never use in production."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-94"

  - id: django-debug-true
    pattern: DEBUG = True
    message: "Django DEBUG=True should never be used in production."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-489"

  # ── SSRF ──────────────────────────────────────────────────────────────────
  - id: requests-with-user-url
    patterns:
      - pattern-either:
          - pattern: requests.$M($A + $B, ...)
          - pattern: requests.$M(f"...", ...)
          - pattern: requests.$M(url=$A + $B, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(get|post|put|patch|delete|head|options|request)$
      - pattern-not: requests.$M("..." + "...", ...)
      - pattern-not: requests.$M(f"{...}", ...)
    message: "Making HTTP requests with user-controlled URLs can lead to SSRF."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-918"
