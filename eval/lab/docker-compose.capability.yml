# P1-7: override cho run capability — gắn vg-under-test vào llm_net (đường tới llm-relay). Dùng cùng docker-compose.lab.yml:
#   docker compose -f eval/lab/docker-compose.lab.yml -f eval/lab/docker-compose.capability.yml --profile capability ...
# Tách file để pentest-safety (không có LLM thật) giữ vg-under-test CHỈ trên lab_net.
services:
  vg-under-test:
    networks:
      llm_net: {ipv4_address: 172.31.252.2}

  # P2-15a: oracle cờ cho bench (eval/bench/fixtures/stub-flag). Chỉ lab_net; cờ ngẫu nhiên do harness đặt (STUB_FLAG) mỗi lần chạy.
  # Cần khai báo `networks` vì override chỉ nhận service ở file này; lab_net đã định nghĩa ở docker-compose.lab.yml.
  stub-flag:
    profiles: [capability]
    container_name: ${VG_LAB_PREFIX:-}lab-stub-flag
    image: python:3.12-slim@sha256:191083cdf6c7bda8c76158983163ead5d5cf7b77cf3033e805bb0f5296f51b4b
    command: ["python", "/srv/server.py"]
    environment:
      FLAG: ${STUB_FLAG:-}
    volumes: ["../bench/fixtures/stub-flag:/srv:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      lab_net: {ipv4_address: 172.31.250.99}
